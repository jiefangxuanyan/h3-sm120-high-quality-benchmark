[workspace]
name = "h3-reproduction"
channels = ["conda-forge", "nvidia"]
# Ubuntu 22.04 / glibc 2.35 baseline used by the RTX PRO 5000 experiments.
platforms = [{ platform = "linux-64", cuda = "13.0", glibc = "2.35" }]

[dependencies]
python = "3.12.*"
git = "*"
# Replaces build-essential; CUDA 13.0 supports GCC through 15.x:
# https://docs.nvidia.com/cuda/archive/13.0.0/cuda-installation-guide-linux/index.html#host-compiler-support-policy
gxx_linux-64 = "<16"
pkg-config = "*"
cuda-toolkit = "13.0.*"
cuda-nvcc = "=13.0.88"
rdma-core = "*"
libnuma = "*"
libsndfile = "*"
ffmpeg = "*"
libgl = "*"
# Replaces libglib2.0-0; only the runtime is needed.
libglib = "*"
# Nsight Systems timeline capture used by profile_high_sglang.sh.
nsight-systems-cli = "==2026.3.2.476"

[activation.env]
CUDA_HOME = "$CONDA_PREFIX"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$CONDA_PREFIX/targets/x86_64-linux/lib"
SGLANG_BUILD_RUST_EXTS = "none"
BUILD_NVEP = "0"
FLASHINFER_BUILD_NO_PIP = "1"
MODEL_PATH = "MiniMaxAI/MiniMax-H3"
MODEL_REVISION = "42ed227ee7df40d41602854ae760620d6eb651fe"


[pypi-dependencies]
pip = "*"
setuptools = "==84.0.0"
setuptools-scm = ">=8"
setuptools-rust = ">=1.11"
wheel = "*"
pytest = "==9.0.2"
torch = { version = "==2.13.0+cu130", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.28.0+cu130", index = "https://download.pytorch.org/whl/cu130" }
aiohttp = "==3.14.3"
anthropic = "==1.11.0"
apache-tvm-ffi = "==0.1.11"
av = "==16.1.0"
blobfile = "==3.0.0"
build = "==1.6.1"
compressed-tensors = "==0.18.0"
cuda-python = "==13.4.1"
cuda-tile = "==1.6.0rc5"
datasets = "==5.0.1"
distro = "==1.9.0"
easydict = "==1.13"
einops = "==0.8.2"
fastapi = "==0.142.2"
flash-attn-4 = "==4.0.0b19"
gguf = "==0.19.0"
interegular = "==0.3.3"
ipython = "==9.17.1"
kernels = "==0.14.1"
llguidance = "==1.9.1"
mistral-common = "==1.12.0"
modelscope = "==1.40.1"
msgspec = "==0.22.0"
ninja = "==1.13.2"
numba = "==0.65.1"
numpy = "==2.3.5"
nvidia-cutlass-dsl = { version = "==4.7.1", extras = ["cu13"] }
nvidia-mathdx = "==25.6.0"
nvidia-ml-py = "==13.615.71"
openai = "==2.6.1"
openai-harmony = "==0.0.4"
orjson = "==3.12.0"
