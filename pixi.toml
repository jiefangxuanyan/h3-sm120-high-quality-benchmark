sglang = { path = "sglang-all/python", editable = true }
flashinfer-python = { path = "flashinfer", editable = true, extras = ["cu13"] }

# Use default isolated builds so fresh environments can bootstrap build requirements.

[tasks]
download-model = "hf download \"$MODEL_PATH\" --revision \"$MODEL_REVISION\" --include 'FL2VA/*' --include '*.json'"
