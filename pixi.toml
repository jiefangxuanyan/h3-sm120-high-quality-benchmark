prometheus-client = "==0.26.0"
psutil = "==7.2.2"
py-spy = "==0.4.2"
pybase64 = "==1.5.0"
pydantic = "==2.13.5"
python-multipart = "==0.0.32"
pyzmq = "==27.2.0"
requests = "==2.34.2"
scipy = "==1.18.1"
